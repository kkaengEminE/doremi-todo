<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doremi Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1><span class="treble">&#9835;</span> Doremi Todo<span class="date-label" id="date-label"></span></h1>
      <div class="header-btns">
        <button id="sort-toggle" title="정렬 순서 변경">&#8595; 오래된순</button>
        <button id="play-all" title="순서대로 재생">&#9654; 재생</button>
      </div>
    </header>

    <div class="input-area">
      <textarea id="todo-input" placeholder="할 일을 입력하세요 (여러 줄 = 다른 음)" rows="2"></textarea>
      <button id="add-btn">추가</button>
    </div>

    <ul class="todo-list" id="todo-list"></ul>
    <div class="summary" id="summary"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
